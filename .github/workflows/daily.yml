name: Daily NHL News Collection
on:
  schedule:
    - cron: '0 12 * * *'  # ~8:00 AM Eastern (EDT, UTC-4)
    - cron: '0 22 * * *'  # ~6:00 PM Eastern (EDT, UTC-4)
  workflow_dispatch: {}    # lets you trigger it manually too

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated database and dashboard
        run: |
          git config user.name "nhl-news-bot"
          git config user.email "bot@example.com"
          git add nhl_news.db dashboard.html
          git commit -m "Daily NHL news update" || echo "Nothing to commit"
          git push
